<title>維修接單雷達</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#f2f4f3;
  --surface:#ffffff;
  --surface-2:#e8ecea;
  --line:#cdd6d3;
  --line-soft:#dde4e2;
  --text:#12191b;
  --text-2:#4d5c60;
  --text-3:#77878b;
  --accent:#e2571c;
  --hot:#e2571c;
  --warm:#c58a12;
  --cool:#4f7f93;
  --good:#2f8f5b;
  --bad:#c8443f;
  --shadow:0 1px 2px rgba(14,20,22,.07),0 8px 24px -16px rgba(14,20,22,.35);
}
:root:not([data-theme="light"]){ color-scheme:dark light }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0b1113; --surface:#141c1f; --surface-2:#1c2629;
    --line:#2b3639; --line-soft:#212b2e;
    --text:#e6ecea; --text-2:#9fb0b2; --text-3:#6f8083;
    --accent:#ff7a2f; --hot:#ff7a2f; --warm:#e0a94a; --cool:#77a9be;
    --good:#4cc188; --bad:#e5615c;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 32px -20px #000;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0b1113; --surface:#141c1f; --surface-2:#1c2629;
  --line:#2b3639; --line-soft:#212b2e;
  --text:#e6ecea; --text-2:#9fb0b2; --text-3:#6f8083;
  --accent:#ff7a2f; --hot:#ff7a2f; --warm:#e0a94a; --cool:#77a9be;
  --good:#4cc188; --bad:#e5615c;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 32px -20px #000;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 110px}

/* ---------- header ---------- */
header.top{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--ground) 90%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft);
}
.top-inner{max-width:1180px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-family:Archivo,"Noto Sans TC",sans-serif;font-weight:800;font-size:18px;letter-spacing:-.015em;white-space:nowrap}
.sync{
  display:flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;
  font-size:11px;color:var(--text-3);white-space:nowrap;
}
.sync .led{width:6px;height:6px;border-radius:50%;background:var(--good)}
.sync.beat .led{animation:beat .9s ease}
@keyframes beat{0%{transform:scale(1);opacity:1}50%{transform:scale(2.1);opacity:.35}100%{transform:scale(1);opacity:1}}
.top-actions{margin-left:auto;display:flex;gap:4px;align-items:center}

.tabs{max-width:1180px;margin:0 auto;padding:0 14px;display:flex;gap:2px}
.tab{
  border:0;background:transparent;color:var(--text-3);padding:8px 14px 9px;
  font-size:14px;font-weight:500;border-bottom:2px solid transparent;display:flex;gap:7px;align-items:center;
}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:700}
.tab .badge{
  font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--surface-2);
  color:var(--text-2);padding:1px 6px;border-radius:999px;
}
.tab[aria-selected="true"] .badge{background:var(--accent);color:#fff}

/* ---------- stats ---------- */
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;margin:14px 0 12px;
}
.stat{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:21px;font-weight:600;line-height:1.15}
.stat .n{font-size:11px;color:var(--text-3)}
.stat.alert .v{color:var(--bad)}
.stat.warn .v{color:var(--warm)}
.stat.go .v{color:var(--good)}
.quota-bar{height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-top:5px}
.quota-bar i{display:block;height:100%;background:var(--good);transition:width .4s ease}
.quota-bar.warn i{background:var(--warm)}
.quota-bar.alert i{background:var(--bad)}

.notice{
  display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);
  border-left:3px solid var(--warm);background:var(--surface);border-radius:8px;
  padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--text-2);
}
.notice strong{color:var(--text)}
.notice.hot{border-left-color:var(--bad)}

/* ---------- filters ---------- */
.filters{padding:8px 0 10px;border-bottom:1px solid var(--line-soft);margin-bottom:2px}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--line);background:var(--surface);color:var(--text-2);
  padding:5px 11px;border-radius:999px;font-size:12.5px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;
}
.chip:hover{border-color:var(--text-3)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--ground);border-color:var(--text)}
.chip .cnt{font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.65}
.searchrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.searchrow input[type="search"]{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:14px}
.searchrow select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--text-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.go{background:var(--good);border-color:var(--good);color:#04140b}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2);padding:6px 8px}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}

.section-head{display:flex;align-items:baseline;gap:9px;margin:18px 0 8px}
.section-head h2{margin:0;font-family:Archivo,"Noto Sans TC",sans-serif;font-size:13px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--text-2)}
.section-head .rule{flex:1;height:1px;background:var(--line-soft)}
.section-head .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--text-3)}
.list{display:flex;flex-direction:column;gap:8px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:26px 18px;text-align:center;color:var(--text-3);font-size:13.5px}

/* ---------- 工單卡 ---------- */
.order{
  display:grid;grid-template-columns:6px 1fr;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;
}
.order .stripe{background:var(--line)}
.order.s-intake .stripe{background:var(--cool)}
.order.s-quoted .stripe{background:var(--warm)}
.order.s-repair .stripe{background:var(--accent)}
.order.s-ready  .stripe{background:var(--good)}
.order.s-done .stripe,.order.s-lost .stripe{background:var(--line)}
.order.s-done,.order.s-lost{opacity:.62}
.order.late{border-color:color-mix(in srgb,var(--bad) 55%,var(--line-soft))}

.o-body{padding:11px 12px;min-width:0;display:flex;flex-direction:column;gap:7px}
.o-top{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap}
.o-no{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--text-3);letter-spacing:.03em}
.o-name{font-size:16px;font-weight:700;line-height:1.3}
.o-name a{color:inherit;text-decoration:none}
.o-name a:hover{color:var(--accent)}
.o-pill{
  margin-left:auto;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--text-2);background:var(--surface-2);white-space:nowrap;
}
.s-intake .o-pill{color:var(--cool);border-color:color-mix(in srgb,var(--cool) 40%,transparent)}
.s-quoted .o-pill{color:var(--warm);border-color:color-mix(in srgb,var(--warm) 40%,transparent)}
.s-repair .o-pill{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.s-ready  .o-pill{background:var(--good);color:#04140b;border-color:var(--good);font-weight:700}

.o-device{font-size:14px;color:var(--text);font-weight:500}
.o-symptom{font-size:13.5px;color:var(--text-2);margin:0;white-space:pre-wrap}
.intake-line{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;
  padding:5px 8px;border-radius:7px;background:var(--surface-2);
  border-left:2px solid var(--cool);font-size:12.5px;
}
.intake-line .il-k{color:var(--text-3);font-size:11px;letter-spacing:.06em}
.intake-line .il-v{color:var(--text);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.intake-line .il-rel{color:var(--text-3);font-size:11.5px}

.timeline{
  display:flex;flex-wrap:wrap;gap:3px 0;border-top:1px solid var(--line-soft);padding-top:7px;
}
.tl-item{
  display:flex;flex-direction:column;gap:1px;padding-right:11px;margin-right:11px;
  border-right:1px solid var(--line-soft);
}
.tl-item:last-child{border-right:0;margin-right:0;padding-right:0}
.tl-k{font-size:10px;letter-spacing:.08em;color:var(--text-3)}
.tl-v{font-size:11.5px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-total .tl-k{color:var(--accent)}
.tl-total .tl-v{color:var(--accent);font-weight:600}

.o-facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--text-3)}
.o-facts b{color:var(--text-2);font-weight:500;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.o-facts .late-txt{color:var(--bad);font-weight:500}
.o-actions{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:1px}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--line-soft)}
.tag.src{color:var(--cool);border-color:color-mix(in srgb,var(--cool) 30%,transparent)}
.o-note{
  border:1px dashed var(--line);border-radius:8px;background:var(--surface-2);
  padding:10px 11px;font-size:13.5px;line-height:1.75;white-space:pre-wrap;
}
.o-note .na{display:flex;gap:6px;margin-top:8px}

/* ---------- 線索卡 ---------- */
.post{display:grid;grid-template-columns:44px 1fr;background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;transition:.15s}
.post:hover{border-color:var(--line)}
.post.tier-hot{border-color:color-mix(in srgb,var(--hot) 45%,var(--line-soft))}
.post.done{opacity:.62}
.spine{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 0;background:var(--surface-2);border-right:1px solid var(--line-soft)}
.score{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;line-height:1}
.tier-hot .score{color:var(--hot)}
.tier-warm .score{color:var(--warm)}
.tier-cool .score{color:var(--cool)}
.tier-cold .score{color:var(--text-3)}
.spine .lbl{font-size:9px;letter-spacing:.08em;color:var(--text-3)}
.spine .dot{width:5px;height:5px;border-radius:50%;background:var(--hot);margin-top:2px}
.pbody{padding:11px 12px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--text-3);margin-bottom:5px}
.meta .src{font-family:"IBM Plex Mono",monospace;color:var(--text-2);font-weight:500}
.meta .sep{opacity:.4}
.post h3{margin:0 0 5px;font-size:15.5px;font-weight:700;line-height:1.4;text-wrap:balance}
.post h3 a{color:inherit;text-decoration:none}
.post h3 a:hover{color:var(--accent)}
.excerpt{font-size:13.5px;color:var(--text-2);margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post.open .excerpt{-webkit-line-clamp:unset;display:block;white-space:pre-wrap}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.tag.device{color:var(--cool);border-color:color-mix(in srgb,var(--cool) 30%,transparent)}
.tag.issue{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.tag.region{color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.rowactions{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.statusgroup{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.statusgroup button{border:0;background:var(--surface);color:var(--text-3);padding:4px 9px;font-size:11.5px;border-right:1px solid var(--line-soft)}
.statusgroup button:last-child{border-right:0}
.statusgroup button[aria-pressed="true"]{background:var(--text);color:var(--ground);font-weight:500}
.pitch{margin-top:9px;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2);padding:10px 11px;font-size:13.5px;line-height:1.75;white-space:pre-wrap}
.pitch .pitch-actions{display:flex;gap:6px;margin-top:8px}
.breakdown{margin-top:8px;font-size:11.5px;color:var(--text-3);font-family:"IBM Plex Mono",monospace;line-height:1.8}
.breakdown b{color:var(--text-2);font-weight:500}
.breakdown .plus{color:var(--good)}
.breakdown .minus{color:var(--bad)}

/* ---------- v2：收機檢查、照片、徽章、料件 ---------- */
.sec{
  margin:16px 0 9px;padding-top:12px;border-top:1px solid var(--line-soft);
  font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);font-weight:600;
}
.fhint{font-size:11.5px;color:var(--text-3);line-height:1.5}

.photo-box{border:1px dashed var(--line);border-radius:9px;padding:10px;background:var(--surface-2)}
.photo-grid{display:flex;flex-wrap:wrap;gap:7px}
.photo-grid:empty{display:none}
.ph{position:relative;width:74px;height:74px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph-x{
  position:absolute;top:2px;right:2px;width:20px;height:20px;line-height:1;
  border:0;border-radius:50%;background:rgba(0,0,0,.66);color:#fff;font-size:14px;padding:0;
}
.photo-add{display:inline-block;margin-top:8px}
.photo-add span{
  display:inline-block;border:1px solid var(--accent);color:var(--accent);
  border-radius:8px;padding:7px 14px;font-size:13.5px;font-weight:600;cursor:pointer;
}
.photo-add.off span{border-color:var(--line);color:var(--text-3);cursor:not-allowed}
.photo-add + .fhint{display:block;margin-top:7px}

.checks{display:flex;flex-direction:column;gap:7px;margin:4px 0 11px}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.55;cursor:pointer}
.chk input{margin-top:3px;width:17px;height:17px;flex:0 0 auto;accent-color:var(--accent)}
.chk.disclaimer{
  border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:var(--surface-2);
  font-size:12.5px;color:var(--text-2);
}
.chk.disclaimer.required{border-color:var(--warm)}
.chk.disclaimer.signed{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--surface-2))}

.quickpick button.on{border-color:var(--accent);background:var(--accent);color:#fff}
.quickpick button.low{border-color:var(--bad)}
.quickpick button .pq{
  margin-left:6px;font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.7;
}

.margin-live{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin:-4px 0 12px;font-size:12.5px}
.margin-live:empty{margin:0}
.ml-k{color:var(--text-3);font-size:11px;letter-spacing:.08em}
.ml-v{font-size:17px;font-weight:700}
.ml-v.good{color:var(--good)}
.ml-v.warn{color:var(--warm)}
.ml-v.bad{color:var(--bad)}
.ml-r{color:var(--text-3);font-size:12px}
.ml-d{color:var(--text-2);margin-left:auto}

.hist{border:1px solid var(--cool);border-radius:9px;padding:9px 10px;margin:-4px 0 12px;
  background:color-mix(in srgb,var(--cool) 8%,var(--surface))}
.hist-head{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;margin-bottom:6px}
.hist-head .btn{margin-left:auto}
.hist-row{display:flex;flex-wrap:wrap;gap:4px 9px;font-size:12px;color:var(--text-2);
  padding:4px 0;border-top:1px solid var(--line-soft);align-items:baseline}
.hr-dev{font-weight:600;color:var(--text)}
.hr-amt{color:var(--text)}
.hr-st{color:var(--text-3)}

.bdgs{display:flex;flex-wrap:wrap;gap:5px}
.bdg{
  font-size:11px;padding:2px 8px;border-radius:5px;font-weight:500;
  background:var(--surface-2);color:var(--text-2);border:1px solid var(--line-soft);
}
.bdg.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.bdg.warn{color:var(--warm);border-color:color-mix(in srgb,var(--warm) 40%,transparent)}
.bdg.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.bdg.muted{color:var(--text-3)}
.wbadge{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line)}
.wbadge.on{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.wbadge.off{color:var(--text-3)}

.photos{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pt{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.pt-n{font-size:11px;color:var(--text-3)}
.o-facts.intake{padding:5px 8px;background:var(--surface-2);border-radius:6px}
.o-facts .mg.good{color:var(--good)}
.o-facts .mg.warn{color:var(--warm)}
.o-facts .mg.bad{color:var(--bad)}
.mg-r{font-size:11px;color:var(--text-3)}
.owe{color:var(--accent);font-weight:500}
.order.stale{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 4%,var(--surface))}

.part{
  display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:11px 12px;
}
.part.low{border-color:var(--bad)}
.pt-name{font-size:15px;font-weight:700;margin-bottom:4px}
.pt-qty{display:flex;align-items:center;gap:9px}
.qbtn{
  width:34px;height:34px;border:1px solid var(--line);background:var(--surface-2);
  border-radius:8px;font-size:17px;line-height:1;color:var(--text);
}
.qbtn:hover{border-color:var(--accent);color:var(--accent)}
.qn{font-size:21px;font-weight:600;min-width:32px;text-align:center}
.qn.low{color:var(--bad)}
.pt-acts{grid-column:1/-1;display:flex;gap:5px}

.lightbox{
  position:fixed;inset:0;z-index:90;background:rgba(6,10,11,.92);
  display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out;
}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.lightbox .lb-x{
  position:absolute;top:14px;right:16px;border:0;background:rgba(255,255,255,.15);
  color:#fff;border-radius:50%;width:36px;height:36px;font-size:19px;
}

/* ---------- v2：線索聯絡方式 ---------- */
.contact{
  margin:6px 0 8px;border:1px solid var(--good);border-radius:9px;overflow:hidden;
  background:color-mix(in srgb,var(--good) 7%,var(--surface));
}
.contact-head{

/* ============================================================
   儲存層：db capability 優先（跨裝置、即時），退回 localStorage
   ============================================================ */
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
};

const API = { on:false, lastCrawl:null, lastNew:0, boards:[], interval:10, lineReady:false, tgReady:false, metaReady:false, fbReady:false, igReady:false, lanUrl:'' };

async function apiGet(path){
  const r = await fetch(path, {cache:'no-store'});
  if (!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function apiPost(path, body){
  return fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}).catch(()=>{});
}

const store = {
  db:null, ready:false,
  orders:new Map(), posts:new Map(), parts:new Map(),
  settings:{ line_quota_used:0, quota_month:monthKey(), keywords:null },
  lastSync:null,

  async init(){
    /* 1) 本機伺服器模式（repair_radar.py 啟動時） */
    try{
      const s = await apiGet('/api/state');
      API.on = true;
      this.applyState(s);
      this.ready = true; this.stamp();
      return;
    }catch(e){ API.on = false; }

    /* 2) Claude Artifact 雲端模式 */
    try{
      if (window.claude && typeof window.claude.use === 'function') this.db = await window.claude.use('db');
    }catch(e){ this.db = null; }
    if (this.db){
      try{
        await this.pull();
        this.db.collection('orders').onSnapshot(l => { this.absorb(l, this.orders); this.stamp(); render(); });
        this.db.collection('posts').onSnapshot(l => { this.absorb(l, this.posts); this.stamp(); render(); });
      }catch(e){ this.db = null; }
    }
    /* 3) 純瀏覽器模式 */
    if (!this.db){
      LS.get('rr_orders',[]).forEach(o => this.orders.set(o.id,o));
      LS.get('rr_posts',[]).forEach(p => this.posts.set(p.id,p));
      LS.get('rr_parts',[]).forEach(p => this.parts.set(p.id,p));
      this.settings = Object.assign(this.settings, LS.get('rr_settings',{}));
    }
    if (this.settings.quota_month !== monthKey()){
      this.settings.quota_month = monthKey();
      this.settings.line_quota_used = 0;
      this.saveSettings();
    }
    this.ready = true; this.stamp();
  },

  applyState(s){
    this.orders.clear(); (s.orders||[]).forEach(o => this.orders.set(o.id, o));
    this.posts.clear();  (s.posts||[]).forEach(p => this.posts.set(p.id, p));
    this.parts.clear();  (s.parts||[]).forEach(p => this.parts.set(p.id, p));
    const st = s.settings || {};
    this.settings = Object.assign({}, this.settings, st, {keywords: s.keywords || null});
    API.lastCrawl = st.last_crawl || null;
    API.lastNew = st.last_crawl_new || 0;
    API.boards = st.boards || [];
    API.interval = st.crawl_interval_minutes || 10;
    API.lineReady = !!st.line_ready;
    API.tgReady = !!st.telegram_ready;
    API.metaReady = !!st.meta_ready;
    API.lanUrl = st.lan_url || '';
    API.fbReady = !!st.meta_page_ready;
    API.igReady = !!st.meta_ig_ready;
    this.stamp();
  },

  absorb(list, map){ (list||[]).forEach(d => { const v = d && d.data ? d.data() : d; if (v && v.id) map.set(v.id, v); }); },

  async pull(){
    if (API.on){
      try{ this.applyState(await apiGet('/api/state')); }catch(e){}
      return;
    }
    if (!this.db){ this.stamp(); return; }
    try{
      const [os, ps, pt, cfg] = await Promise.all([
        this.db.collection('orders').limit(500).get(),
        this.db.collection('posts').limit(500).get(),
        this.db.collection('parts').limit(200).get(),
        this.db.doc('config/settings').get(),
      ]);
      this.orders.clear(); this.absorb(os, this.orders);
      this.posts.clear();  this.absorb(ps, this.posts);
      this.parts.clear();  this.absorb(pt, this.parts);
      const cv = cfg && (cfg.data ? cfg.data() : cfg);
      if (cv) this.settings = Object.assign(this.settings, cv);
      this.stamp();
    }catch(e){}
  },

  stamp(){ this.lastSync = new Date(); },

  saveOrder(o){
    this.orders.set(o.id,o);
    if (API.on) apiPost('/api/orders', o);
    else if (this.db) this.db.doc('orders/'+o.id).set(o).catch(()=>{});
    else LS.set('rr_orders',[...this.orders.values()]);
    this.stamp();
  },
  removeOrder(id){
    this.orders.delete(id);
    if (API.on) apiPost('/api/delete', {table:'orders', id});
    else if (this.db) this.db.doc('orders/'+id).delete().catch(()=>{});
    else LS.set('rr_orders',[...this.orders.values()]);
  },
  savePost(p){
    this.posts.set(p.id,p);
    if (API.on) apiPost('/api/posts', p);
    else if (this.db) this.db.doc('posts/'+p.id).set(p).catch(()=>{});
    else LS.set('rr_posts',[...this.posts.values()]);
  },
  removePost(id){
    this.posts.delete(id);
    if (API.on) apiPost('/api/delete', {table:'posts', id});
    else if (this.db) this.db.doc('posts/'+id).delete().catch(()=>{});
    else LS.set('rr_posts',[...this.posts.values()]);
  },
  savePart(p){
    p.updated_at = new Date().toISOString();
    this.parts.set(p.id, p);
    if (API.on) apiPost('/api/parts', p);
    else if (this.db) this.db.doc('parts/'+p.id).set(p).catch(()=>{});
    else LS.set('rr_parts',[...this.parts.values()]);
    this.stamp();
  },
  removePart(id){
    this.parts.delete(id);
    if (API.on) apiPost('/api/delete', {table:'parts', id});
    else if (this.db) this.db.doc('parts/'+id).delete().catch(()=>{});
    else LS.set('rr_parts',[...this.parts.values()]);
  },
  async takePart(id, qty){
    const p = this.parts.get(id); if (!p) return;
    p.qty = Math.max(0, (p.qty||0) - (qty||1));
    if (API.on) await apiPost('/api/part-take', {id, qty: qty||1});
    else this.savePart(p);
    this.parts.set(id, p);
  },
  saveSettings(){

    else if (this.db) this.db.doc('config/settings').set(this.settings).catch(()=>{});
    else LS.set('rr_settings', this.settings);
  },
  saveKeywords(kw){
    this.settings.keywords = kw;
    if (API.on) apiPost('/api/keywords', kw || {});
    else this.saveSettings();
  },
  keywords(){ return this.settings.keywords || DEFAULT_KEYWORDS; },

  nextNo(){

    const day = String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    const used = [...this.orders.values()].filter(o => (o.no||'').includes(day)).length;
    return 'R'+day+'-'+String(used+1).padStart(2,'0');

function monthKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

/* ============================================================
   雷達評分
   ============================================================ */
function normalize(s){ return (s||'').toLowerCase(); }

function scorePost(post, allP){
  const kw = store.keywords();
  const text = normalize(post.title+'\n'+post.body);
  const hits = []; let total = 0;
  for (const g of Object.values(kw)){
    const found = (g.words||[]).filter(w => w && text.includes(normalize(w)));
    if (found.length){ total += g.weight; hits.push({label:g.label, weight:g.weight, detail:found.slice(0,3).join('、')}); }
  }
  const ageMin = (Date.now() - new Date(post.posted_at).getTime())/60000;
  if (ageMin <= 60){ total += RULE_FRESH.weight; hits.push({label:RULE_FRESH.label, weight:RULE_FRESH.weight, detail:Math.max(0,Math.round(ageMin))+' 分鐘前'}); }
  const bodyLen = (post.body||'').replace(/\s/g,'').length;
  if (bodyLen < 20){ total += RULE_SHORT.weight; hits.push({label:RULE_SHORT.label, weight:RULE_SHORT.weight, detail:bodyLen+' 字'}); }
  if (post.author && post.author !== '匿名'){
    const same = (allP||[]).filter(p => p.author === post.author).length;
    if (same >= 3){ total += RULE_SHOP.weight; hits.push({label:RULE_SHOP.label, weight:RULE_SHOP.weight, detail:same+' 篇'}); }
  }
  return { score: Math.max(0, Math.min(100, total)), hits };
}
function detect(map, text){ const t = normalize(text); return map.filter(m => m.words.some(w => t.includes(normalize(w)))).map(m => m.label); }
function detectRegion(text){ return [...new Set(REGION_WORDS.filter(w => text.includes(w)))]; }

function enrich(post, all){
  const {score,hits} = scorePost(post, all);
  const text = post.title+'\n'+post.body;
  return Object.assign({}, post, {
    score, hits,
    devices: detect(DEVICE_MAP, text),
    issues: detect(ISSUE_MAP, text),
    regions: detectRegion(text),
    status: post.status || 'new',
  });
}
function threshold(){
  const used = store.settings.line_quota_used || 0;
  if (used >= 195) return {value:Infinity, mode:'off'};
  if (used >= 180) return {value:85, mode:'tight'};
  return {value:70, mode:'normal'};
}
const PSTATUS = { new:'未處理', contact:'已聯絡', deal:'已成交', skip:'不適合' };

/* ============================================================

   ============================================================ */
const PITCH_OPENERS = {
  '螢幕': d => `${d} 螢幕摔破如果觸控還正常、顯示也沒有線條，通常換總成就好，內部零件多半沒事。原廠料跟副廠價差不少，看你打算再用多久決定就行。`,
  '進水': d => `${d} 進水最怕的是通電，先別急著開機或充電，也不要用吹風機熱風吹。越早拆開做清洗、把腐蝕擋下來，救回來的機會越高，資料通常也還在。`,
  '電池': d => `${d} 這種膨脹或掉電特別快，八成是電池循環數到了，換電池就好，不用整台換。膨脹會頂到螢幕，別再拖，越頂越貴。`,
  '開不了機': d => `${d} 完全沒反應的話，先排除電池跟尾插這兩個，是最常見也最便宜的原因。真的都不是才會往主機板方向查。`,
  '充電': d => `${d} 充電要喬角度通常是尾插排線鬆或積灰，單換尾插就能解決，不用動到主機板。`,
  '主機板': d => `${d} 主機板的問題要看是哪一組電路，通常要上機測才知道。修之前一定要先確認資料還救不救得回來。`,
  '鏡頭': d => `${d} 鏡頭玻璃裂通常只要換外層玻璃，模組本身沒事的話成本差很多。`,
};
function makePitch(p){
  const device = p.devices[0] || '你的機器';
  const opener = (PITCH_OPENERS[p.issues[0]] || (d => `${d} 這個狀況要先做檢測才能確定是哪個零件出問題。`))(device);
  const local = p.regions.length ? `你在${p.regions[0]}的話離我很近，` : `不方便跑一趟的話也可以寄修，`;
  return opener + '\n\n' + `我在中和有在做這塊，${local}需要的話可以先幫你估個價，檢測不收費也不用先付錢。`;
}
function readyMsg(o){

function quoteMsg(o){

const WK = ['日','一','二','三','四','五','六'];
/* 9/6（六）14:30 — 跨年才補上年份 */
function stamp(iso, withYear){
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const y = d.getFullYear() !== new Date().getFullYear() || withYear ? d.getFullYear()+'/' : '';
  return `${y}${d.getMonth()+1}/${d.getDate()}（${WK[d.getDay()]}）`
       + `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
/* datetime-local 欄位用 */
function toLocalInput(iso){
  const d = iso ? new Date(iso) : new Date();
  if (isNaN(d)) return '';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fromLocalInput(v){
  if (!v) return null;
  const d = new Date(v);
  return isNaN(d) ? null : d.toISOString();
}
/* 兩個時間點之間的耗時 */
function span(a, b){
  if (!a || !b) return '';
  const m = Math.round((new Date(b) - new Date(a)) / 60000);
  if (m < 0) return '';
  return m < 60 ? m + ' 分' : m < 1440 ? (m/60).toFixed(1).replace('.0','') + ' 小時'
                                        : (m/1440).toFixed(1).replace('.0','') + ' 天';
}

function relTime(iso){
  const m = Math.round((Date.now() - new Date(iso).getTime())/60000);
  if (m < 1) return '剛剛';
  if (m < 60) return m+' 分鐘前';
  if (m < 1440) return Math.floor(m/60)+' 小時前';
  return Math.floor(m/1440)+' 天前';
}
function dueTime(iso){
  const m = Math.round((new Date(iso).getTime() - Date.now())/60000);
  if (m < 0) return {txt:'逾期 '+fmtDur(-m), late:true};
  return {txt:'剩 '+fmtDur(m), late:false};
}
function fmtDur(m){ return m < 60 ? m+' 分' : m < 1440 ? Math.floor(m/60)+' 小時' : Math.floor(m/1440)+' 天'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function money(n){ return (n||0).toLocaleString('en-US'); }

/* ---------- v2 工具 ---------- */
const READY_OVERDUE_DAYS = 7;

function warrantyState(o){
  if (!o.warranty_until) return null;
  const end = new Date(o.warranty_until);
  if (isNaN(end)) return null;
  const days = Math.ceil((end - Date.now()) / 86400000);
  return days >= 0
    ? {ok:true,  days, text:`保固中（剩 ${days} 天）`}
    : {ok:false, days, text:`已過保（${end.getFullYear()}/${end.getMonth()+1}/${end.getDate()} 到期）`};
}
function warrantyBadge(o){
  const w = warrantyState(o);
  if (!w) return '';
  return `<span class="wbadge ${w.ok?'on':'off'}">${w.text}</span>`;
}
function marginOf(o){
  const rev = (o.paid || o.quote || 0), cost = (o.cost || 0);
  return {value: rev - cost, rate: rev ? Math.round((rev-cost)/rev*100) : 0};
}
function marginClass(m, rev){
  if (m < 0) return 'bad';
  return rev && (m / rev) < 0.3 ? 'warn' : 'good';
}
/* ready 超過 N 天沒取件 */
function pickupOverdue(o){
  if (o.status !== 'ready' || !o.ready_at) return 0;
  const d = Math.floor((Date.now() - new Date(o.ready_at)) / 86400000);
  return d >= READY_OVERDUE_DAYS ? d : 0;
}
function lowParts(){
  return [...store.parts.values()].filter(p => (p.qty||0) <= (p.low_at||1));
}

/* 已經走過的階段，各自蓋的實際時間 */
function timeline(o){

    ['收件', o.created_at],
    ['報價', o.quoted_at],
    ['開修', o.repair_at],
    ['完工', o.ready_at],
    ['取件', o.done_at],
  ].filter(x => x[1]);
  if (steps.length < 2) return '';
  const total = span(o.created_at, steps[steps.length-1][1]);
  return `<div class="timeline">
    ${steps.map(([k,v]) => `<div class="tl-item"><span class="tl-k">${k}</span><span class="tl-v mono">${stamp(v)}</span></div>`).join('')}
    ${total ? `<div class="tl-item tl-total"><span class="tl-k">歷時</span><span class="tl-v mono">${total}</span></div>` : ''}
  </div>`;
}

/* 一眼看出：免責簽了沒、資料重不重要、保固、逾期未取 */
function badges(o){
  const b = [];

  if (o.disclaimer_ok) b.push('<span class="bdg ok">免責已簽</span>');
  else if (risky) b.push('<span class="bdg danger">免責未簽</span>');
  if (o.data_critical) b.push('<span class="bdg warn">資料重要</span>');
  if (o.backed_up) b.push('<span class="bdg">已備份</span>');
  const w = warrantyState(o);

  return b.length ? `<div class="bdgs">${b.join('')}</div>` : '';
}

/* ---------- 線索的聯絡方式 ----------
   店家看到需求後第一件事是「怎麼找到這個人」，所以把能聯絡的管道全部抓出來擺在最上面。 */
const RE_PHONE = /(?:^|[^0-9])(09\d{2}[-\s]?\d{3}[-\s]?\d{3})(?![0-9])/g;
const RE_LINE  = /(?:line|LINE|賴|line\s*id|加我)[\s:：@]*([A-Za-z0-9_.\-]{4,30})/g;
const RE_IG    = /(?:ig|IG|instagram)[\s:：@]*([A-Za-z0-9_.]{3,30})/g;
const RE_EMAIL = /([A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,})/g;

function grab(re, text){
  const out = [];
  let m; re.lastIndex = 0;
  while ((m = re.exec(text)) !== null){
    const v = (m[1] || '').trim();
    if (v && !out.includes(v)) out.push(v);
    if (out.length >= 3) break;
  }
  return out;
}

function contactsOf(p){
  const text = (p.title || '') + '\n' + (p.body || '');
  const rows = [];

  // 1. 來源本身的帳號 —— 最可靠的一條
  if (p.source && p.source.indexOf('PTT') === 0){
    rows.push({k:'PTT 帳號', v:p.author, copy:p.author,
               link:`https://www.ptt.cc/bbs/${(p.board||'')}/index.html`, how:'在原文推文或站內信'});
  } else if (p.source && p.source.indexOf('IG') === 0){
    rows.push({k:'IG 帳號', v:p.author, copy:p.author,
               link:p.author && p.author !== '（未提供名稱）' ? `https://www.instagram.com/${p.author}/` : '',
               how: p.direct ? '直接回私訊' : '在留言下回覆或私訊'});
  } else if (p.source && p.source.indexOf('FB') === 0){
    rows.push({k:'FB 名稱', v:p.author, copy:p.author,
               link:'https://business.facebook.com/latest/inbox',
               how: p.direct ? '直接回私訊' : '在留言下回覆'});
  } else if (p.author && p.author !== '—'){
    rows.push({k:'發文者', v:p.author, copy:p.author, how:'在原文回覆'});
  }

  // 2. 對方自己留在內文的聯絡方式
  grab(RE_PHONE, text).forEach(v => rows.push({k:'電話', v:v.replace(/[-\s]/g,''),
    copy:v.replace(/[-\s]/g,''), tel:true, how:'直接打過去'}));
  grab(RE_LINE, text).forEach(v => rows.push({k:'LINE ID', v, copy:v, how:'加好友'}));
  grab(RE_IG, text).forEach(v => rows.push({k:'IG', v, copy:v,
    link:`https://www.instagram.com/${v}/`, how:'私訊'}));
  grab(RE_EMAIL, text).forEach(v => rows.push({k:'Email', v, copy:v, how:'寄信'}));

  return rows;
}

function contactBlock(p){
  const rows = contactsOf(p);
  if (!rows.length) return '';
  return `<div class="contact">
    <div class="contact-head">怎麼聯絡這位客人</div>
    ${rows.map((r,i) => `<div class="contact-row">
      <span class="ct-k">${esc(r.k)}</span>
      <span class="ct-v">${r.tel ? `<a href="tel:${esc(r.v)}">${esc(r.v)}</a>`
        : r.link ? `<a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.v)}</a>`
        : esc(r.v)}</span>
      <span class="ct-acts">
        <button class="btn ghost sm" data-ctcopy="${esc(r.copy||r.v)}">複製</button>
        ${r.tel ? `<a class="btn sm" href="tel:${esc(r.v)}">撥號</a>` : ''}
      </span>
    </div>`).join('')}
  </div>`;
}

function postCard(p){
  const tv = threshold().value === Infinity ? 70 : threshold().value;
  const tier = (p.direct || p.score >= tv) ? 'hot' : p.score >= 50 ? 'warm' : p.score >= 30 ? 'cool' : 'cold';
  const tags = [
    ...p.devices.map(d=>`<span class="tag device">${esc(d)}</span>`),
    ...p.issues.map(i=>`<span class="tag issue">${esc(i)}</span>`),

/* 推進到下一階段。免責、扣料、取件人這三道關卡都在這裡。 */
async function advanceStage(raw){
  const nx = OSTATUS[raw.status] && OSTATUS[raw.status].next;
  if (!nx) return;

  // 關卡一：高風險維修沒簽免責，不准開修
  if (nx === 'repair' && needsDisclaimer(raw) && !raw.disclaimer_ok){
    blockSheet(raw);
    return;
  }

  // 關卡二：有綁料件就問要不要扣庫存（實務上常臨時換料，不自動扣）
  if (nx === 'repair' && raw.part_id && store.parts.get(raw.part_id)){
    const p = store.parts.get(raw.part_id);
    const yes = await confirmSheet('要扣庫存嗎？',
      `這張單綁了「${esc(p.name)}」，目前庫存 ${p.qty||0} 片。`,
      '扣 1 片', '不扣，我換別的料');
    if (yes) { await store.takePart(raw.part_id, 1); toast(`${p.name} 已扣 1 片，剩 ${store.parts.get(raw.part_id).qty} 片`); }
  }

  // 關卡三：取件要簽收
  if (nx === 'done'){
    const who = await pickupSheet(raw);
    if (who === null) return;              // 取消
    raw.picked_by = who;
    raw.picked_at = new Date().toISOString();
  }

  raw.status = nx;
  const field = STAGE_STAMP[nx];
  if (field) raw[field] = new Date().toISOString();
  if (nx === 'done'){
    if (!raw.paid) raw.paid = raw.quote || 0;
    const days = parseInt(raw.warranty_days, 10) || store.settings.default_warranty_days || 90;
    raw.warranty_days = days;
    raw.warranty_until = new Date(Date.now() + days*86400000).toISOString();
  }
  store.saveOrder(raw);
  render();
  const w = nx === 'done' ? `，保固到 ${stamp(raw.warranty_until).split('（')[0]}` : '';
  toast((nx === 'ready' ? '已轉待取件，記得通知客戶' : '已更新為 '+OSTATUS[nx].label)
        + '（' + stamp(raw[field]) + '）' + w);
}

/* 取件簽收 */
function pickupSheet(raw){
  return new Promise(resolve => {
    const owe = Math.max(0, (raw.quote||0) - (raw.deposit||0));
    const bg = openSheet(`
      <h2>取件簽收</h2>
      <p class="hint">${esc(raw.no)}　${esc(raw.device||'')}</p>
      ${raw.deposit ? `<div class="notice" style="margin:0 0 12px"><span>◆</span><div>
        報價 ${money(raw.quote||0)}，已收訂金 ${money(raw.deposit)}，<strong>尚需收 ${money(owe)}</strong>。
      </div></div>` : ''}
      <div class="field"><label>取件人</label>
        <input id="pk_who" value="${esc(raw.customer||'')}" placeholder="客戶本人或代領人">
        <span class="fhint">不是本人來拿就改掉，例如「客戶友人 王小姐」。</span>
      </div>
      <div class="field"><label>實收金額</label>
        <input id="pk_paid" type="number" inputmode="numeric" value="${raw.paid || raw.quote || 0}">
      </div>
      <div class="sheet-actions">
        <button class="btn" data-close>取消</button>
        <button class="btn go" id="pk_ok">確認取件</button>
      </div>`);
    let done = false;
    bg.querySelector('[data-close]').onclick = () => { done = true; bg.remove(); resolve(null); };
    bg.addEventListener('click', e => { if (e.target === bg && !done){ done = true; resolve(null); } });
    bg.querySelector('#pk_ok').onclick = () => {
      done = true;
      raw.paid = parseInt(bg.querySelector('#pk_paid').value, 10) || raw.quote || 0;
      const who = (bg.querySelector('#pk_who').value || '').trim() || raw.customer || '—';
      bg.remove();
      resolve(who);
    };
  });
}

document.addEventListener('click', e => {
  /* 篩選 */
  const c1 = e.target.closest('[data-ostatus]'); if (c1){ state.oStatus = c1.dataset.ostatus; render(); return; }
  const c2 = e.target.closest('[data-pstatus]'); if (c2){ state.pStatus = c2.dataset.pstatus; render(); return; }
  const c3 = e.target.closest('[data-pdevice]'); if (c3){ state.pDevice = c3.dataset.pdevice; render(); return; }

  /* 複製 / 關閉訊息 */
  const cp = e.target.closest('[data-copy]');
  if (cp){
    const box = cp.closest('.o-note') || cp.closest('.pitch');
    const text = box._text || box.childNodes[0].textContent;
    navigator.clipboard.writeText(text).then(()=>toast('已複製，可直接貼到 LINE'),()=>toast('複製失敗，請長按選取'));
    return;
  }
  if (e.target.closest('[data-closemsg]')){ e.target.closest('.slot-msg').innerHTML = ''; return; }

  /* 複製聯絡方式 */
  const cc = e.target.closest('[data-ctcopy]');
  if (cc){
    navigator.clipboard.writeText(cc.dataset.ctcopy).then(
      () => toast('已複製 ' + cc.dataset.ctcopy),
      () => toast('複製失敗，請長按選取'));
    return;
  }

  /* 照片點開看大圖 */
  const big = e.target.closest('[data-big]');
  if (big){
    const lb = document.createElement('div');
    lb.className = 'lightbox';
    lb.innerHTML = `<button class="lb-x" aria-label="關閉">×</button><img src="${photoUrl(big.dataset.big)}" alt="現況照片">`;
    lb.addEventListener('click', () => lb.remove());
    document.body.appendChild(lb);
    return;
  }

  /* 料件增減 */
  const qb = e.target.closest('[data-qty]');
  if (qb){
    const p = store.parts.get(qb.dataset.id); if (!p) return;
    p.qty = Math.max(0, (p.qty||0) + (+qb.dataset.qty));
    store.savePart(p); render();
    return;
  }
  const pa2 = e.target.closest('[data-pact2]');
  if (pa2){
    const p = store.parts.get(pa2.dataset.id); if (!p) return;
    if (pa2.dataset.pact2 === 'edit') partSheet(p);
    else { store.removePart(p.id); render(); toast('料件已刪除'); }
    return;
  }

  /* 工單動作 */
  const oa = e.target.closest('[data-oact]');
  if (oa){
    const o = findOrder(oa.dataset.oid); if (!o) return;
    if (o.demo && oa.dataset.oact !== 'notify' && oa.dataset.oact !== 'quotemsg'){ toast('示範工單不會被儲存，先開一張自己的單'); return; }
    const raw = store.orders.get(o.id);
    const act = oa.dataset.oact;

    if (act === 'next'){
      advanceStage(raw);
      return;
    }
    if (act === 'lost'){
      raw.status = 'lost';
      raw.done_at = new Date().toISOString();
      store.saveOrder(raw); render(); toast('已標記未成交'); return;
    }
    if (act === 'del'){ store.removeOrder(o.id); render(); toast('工單已刪除'); return; }
    if (act === 'edit'){ orderSheet(o); return; }
    if (act === 'label'){ printLabel(o); return; }
    if (act === 'notify' || act === 'quotemsg'){
      const slot = oa.closest('.o-body').querySelector('.slot-msg');
      if (slot.innerHTML){ slot.innerHTML = ''; return; }
      const text = act === 'notify' ? readyMsg(o) : quoteMsg(o);
      slot.innerHTML = msgBox(text, o.id);
      slot.querySelector('.o-note')._text = text;
      return;
    }
  }

  /* 線索狀態 */
  const ps = e.target.closest('.statusgroup button');
  if (ps){
    const p = findPost(ps.dataset.pid); if (!p) return;
    if (p.demo){ toast('示範線索不會被儲存'); return; }
    const raw = store.posts.get(p.id);
    raw.status = raw.status === ps.dataset.ps ? 'new' : ps.dataset.ps;
    store.savePost(raw); render(); return;
  }

  /* 線索動作 */
  const pa = e.target.closest('[data-pact]');
  if (pa){
    const p = findPost(pa.dataset.pid); if (!p) return;
    const art = pa.closest('.post');
    const act = pa.dataset.pact;

    if (act === 'expand'){ art.classList.toggle('open'); return; }
    if (act === 'why'){ const s = art.querySelector('.slot-why'); s.hidden = !s.hidden; return; }
    if (act === 'del'){ store.removePost(p.id); render(); toast('線索已移除'); return; }
    if (act === 'toorder'){
      orderSheet({
        device: p.devices[0] || '',
        symptom: p.title + (p.body ? '\n' + p.body.slice(0,120) : ''),
        source: '網路線索',
        lead_url: p.url && p.url !== '#' ? p.url : '',
        lead_id: p.demo ? '' : p.id,
      });
      return;
    }
    if (act === 'pitch'){
      const slot = art.querySelector('.slot-pitch');
      if (slot.innerHTML){ slot.innerHTML = ''; return; }
      const text = makePitch(p);
      slot.innerHTML = `<div class="pitch">${esc(text)}<div class="pitch-actions">
        <button class="btn sm primary" data-copy="${p.id}">複製</button></div></div>`;
      slot.querySelector('.pitch')._text = text;
      return;
    }
  }
});

function parseList(v){

/* 選檔後在瀏覽器端縮到最長邊 1280、JPEG 0.7 再上傳，免得硬碟被原圖塞爆 */
function shrinkImage(file, maxEdge, quality){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('讀取檔案失敗'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('這個檔案不是圖片'));
      img.onload = () => {
        const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(img.width * scale));
        cv.height = Math.max(1, Math.round(img.height * scale));
        const cx = cv.getContext('2d');
        cx.fillStyle = '#fff';
        cx.fillRect(0, 0, cv.width, cv.height);
        cx.drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

      <div class="field"><label>料件成本</label><input id="f_cost" type="number" inputmode="numeric" value="${o.cost||''}" placeholder="1600"></div>
      <div class="field"><label>已收訂金</label><input id="f_deposit" type="number" inputmode="numeric" value="${o.deposit||''}" placeholder="0"></div>

    <div class="row3">
      <div class="field"><label>實收</label><input id="f_paid" type="number" inputmode="numeric" value="${o.paid||''}" placeholder="取件時填"></div>
      <div class="field"><label>保固天數</label><input id="f_warranty" type="number" inputmode="numeric" value="${o.warranty_days||90}"></div>
      <div class="field"><label>幾小時內完成</label><input id="f_due" type="number" inputmode="numeric" value="${dueHours}"></div>
    </div>

      <div class="field"><label>來源</label><select id="f_source">

      </select></div>
      <div class="field"><label>狀態</label><select id="f_status">
        ${Object.entries(OSTATUS).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v.label}</option>`).join('')}
      </select></div>

      <button class="btn" data-close>取消</button>

  const q = id => bg.querySelector('#'+id);
  const g = id => (q(id).value || '').trim();

  /* ---- 快選 ---- */
  bg.querySelectorAll('[data-fill]').forEach(b => b.onclick = () => { q(b.dataset.fill).value = b.dataset.val; syncDisclaimerHint(); });
  bg.querySelectorAll('[data-append]').forEach(b => b.onclick = () => {
    const ta = q(b.dataset.append);
    ta.value = ta.value ? ta.value.replace(/\s*$/,'') + '、' + b.dataset.val : b.dataset.val;
    syncDisclaimerHint();
  });
  bg.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => {

    wrap.classList.toggle('required', risky);

      ? '這張單屬於高風險維修，沒勾這欄就不能推進到「維修中」。'

    hint.style.color = risky && !q('f_disclaimer').checked ? 'var(--bad)' : 'var(--text-3)';
  }
  q('f_symptom').addEventListener('input', syncDisclaimerHint);
  q('f_device').addEventListener('input', syncDisclaimerHint);
  q('f_disclaimer').addEventListener('change', () => {

  function updateMargin(){
    const quote = parseInt(g('f_quote'),10) || 0;
    const cost = parseInt(g('f_cost'),10) || 0;
    const dep = parseInt(g('f_deposit'),10) || 0;
    const el = q('f_margin');
    if (!quote && !cost){ el.innerHTML = ''; return; }
    const m = quote - cost;
    const rate = quote ? Math.round(m / quote * 100) : 0;
    const cls = m < 0 ? 'bad' : rate < 30 ? 'warn' : 'good';
    el.innerHTML = `<span class="ml-k">毛利</span><span class="ml-v ${cls} mono">${money(m)}</span>`
      + `<span class="ml-r">${quote ? rate + '%' : ''}</span>`

    const phone = g('f_phone').replace(/[^0-9+]/g,'');

        if (last.device) q('f_device').value = last.device;

        syncDisclaimerHint();
      };
    } catch(e){ box.innerHTML = ''; }
  }
  q('f_phone').addEventListener('input', () => {
    clearTimeout(histTimer); histTimer = setTimeout(lookupHistory, 350);
  });
  lookupHistory();

  /* ---- 照片 ---- */
  function drawPhotos(){
    const grid = q('f_photos');
    grid.innerHTML = photos.map((n,i) => `<div class="ph">
        <img src="${photoUrl(n)}" alt="現況照片 ${i+1}">
        <button type="button" class="ph-x" data-rm="${i}" title="移除">×</button>
      </div>`).join('');
    grid.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
      photos.splice(+b.dataset.rm, 1); drawPhotos();
    });

  if (fileInput) fileInput.addEventListener('change', async e => {
    const files = [...(e.target.files || [])];
    e.target.value = '';
    const hint = q('f_photohint');
    for (let i = 0; i < files.length; i++){
      hint.textContent = `處理第 ${i+1}／${files.length} 張…`;
      try {
        const dataUrl = await shrinkImage(files[i], 1280, 0.7);
        const res = await uploadPhoto(oid, dataUrl);
        if (res.ok){ photos.push(res.filename); drawPhotos(); }
        else { hint.textContent = '上傳失敗：' + (res.msg || '未知原因'); return; }
      } catch(err){ hint.textContent = '處理失敗：' + err.message; return; }
    }
    hint.textContent = `已存 ${photos.length} 張。收機前先拍：正面、背面、開機畫面。`;
  });

  /* ---- 儲存 ---- */
  bg.querySelector('[data-close]').onclick = () => bg.remove();
  q('f_save').onclick = () => {
    if (!g('f_customer') && !g('f_phone')){ toast('至少要有姓名或電話'); return; }
    const dueH = parseFloat(g('f_due')) || 24;
    const signed = q('f_disclaimer').checked ? 1 : 0;
    const rec = {
      id: oid,
      no: editing ? o.no : store.nextNo(),
      customer: g('f_customer') || '—',
      phone: g('f_phone'),
      device: g('f_device'),
      symptom: g('f_symptom'),
      quote: parseInt(g('f_quote'),10) || 0,
      cost: parseInt(g('f_cost'),10) || 0,
      deposit: parseInt(g('f_deposit'),10) || 0,
      paid: parseInt(g('f_paid'),10) || 0,
      source: g('f_source'),
      status: g('f_status'),
      note: g('f_note'),
      lead_url: o.lead_url || '',
      created_at: fromLocalInput(g('f_created')) || o.created_at || new Date().toISOString(),
      due_at: new Date(Date.now() + dueH*3600000).toISOString(),
      quoted_at: o.quoted_at || null,
      repair_at: o.repair_at || null,
      ready_at: o.ready_at || null,
      done_at: o.done_at || null,
      imei: g('f_imei'),
      unlock: g('f_unlock'),
      accessories: JSON.stringify(acc),
      backed_up: q('f_backed').checked ? 1 : 0,
      data_critical: q('f_critical').checked ? 1 : 0,
      intake_photos: JSON.stringify(photos),
      disclaimer_ok: signed,
      disclaimer_at: signed ? (o.disclaimer_at || new Date().toISOString()) : null,
      warranty_days: parseInt(g('f_warranty'),10) || 90,
      warranty_until: o.warranty_until || null,
      part_id: o.part_id || '',
      picked_by: o.picked_by || '',
      picked_at: o.picked_at || null,
    };
    store.saveOrder(rec);
    if (o.lead_id && store.posts.get(o.lead_id)){
      const lp = store.posts.get(o.lead_id); lp.status = 'deal'; store.savePost(lp);
    }
    bg.remove();
    state.view = 'orders'; state.oStatus = 'active';
    render();
    toast(editing ? '已儲存' : '工單 '+rec.no+' 已建立');
  };
}

/* ---------- 列印標籤 ----------
   純前端、不連外。Code 39 條碼用 canvas 手畫，任何一般條碼槍都掃得到。
   （沒有引入 QR 函式庫：離線可用是硬性要求，手刻 QR 編碼器風險高於效益。） */
const C39 = {
  '0':'101001101101','1':'110100101011','2':'101100101011','3':'110110010101',
  '4':'101001101011','5':'110100110101','6':'101100110101','7':'101001011011',
  '8':'110100101101','9':'101100101101','A':'110101001011','B':'101101001011',
  'C':'110110100101','D':'101011001011','E':'110101100101','F':'101101100101',
  'G':'101010011011','H':'110101001101','I':'101101001101','J':'101011001101',
  'K':'110101010011','L':'101101010011','M':'110110101001','N':'101011010011',
  'O':'110101101001','P':'101101101001','Q':'101010110011','R':'110101011001',
  'S':'101101011001','T':'101011011001','U':'110010101011','V':'100110101011',
  'W':'110011010101','X':'100101101011','Y':'110010110101','Z':'100110110101',
  '-':'100101011011','.':'110010101101',' ':'100110101101','*':'100101101101',
};
function drawCode39(canvas, text){
  const code = '*' + String(text).toUpperCase().replace(/[^0-9A-Z\-. ]/g,'') + '*';
  const bars = [...code].map(c => C39[c]).filter(Boolean).join('0');
  if (!bars) return false;
  const narrow = 2, h = 70, pad = 12;
  canvas.width = bars.length * narrow + pad*2;
  canvas.height = h + pad;
  const cx = canvas.getContext('2d');
  cx.fillStyle = '#fff'; cx.fillRect(0,0,canvas.width,canvas.height);
  cx.fillStyle = '#000';
  let x = pad;
  for (const b of bars){
    if (b === '1') cx.fillRect(x, 4, narrow, h);
    x += narrow;
  }
  return true;
}

    if (!raw){ bg.remove(); render(); toast('已更新額度'); return; }
    let arr; try{ arr = JSON.parse(raw); }catch(e){ toast('JSON 格式有誤'); return; }
    if (!Array.isArray(arr)){ toast('最外層必須是陣列 [ ]'); return; }
    const seen = new Set([...store.posts.values()].map(p=>p.url).filter(u=>u&&u!=='#'));
    let n = 0;
    arr.forEach(it => {
      if (!it || (!it.title && !it.body)) return;
      if (it.url && seen.has(it.url)) return;
      store.savePost({
        id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
        title:String(it.title||'(無標題)'), body:String(it.body||''),
        source:String(it.source||'未知來源'), author:String(it.author||'—'),
        url:String(it.url||'#'), posted_at:it.posted_at||new Date().toISOString(),
        status:'new', created_at:new Date().toISOString(),
      });
      if (it.url) seen.add(it.url); n++;
    });
    bg.remove(); state.view = 'radar'; render(); toast(`匯入 ${n} 則，略過 ${arr.length-n} 則`);
  };
});

/* ---------- 關鍵字 ---------- */
document.getElementById('btnKw').addEventListener('click', () => {
  const kw = JSON.parse(JSON.stringify(store.keywords()));
  const groups = Object.entries(kw).map(([key,g]) => `
    <div class="kw-group">
      <div class="kw-head"><span>${esc(g.label)}</span><span class="w ${g.weight>0?'plus':'minus'}">${g.weight>0?'+':''}${g.weight} 分</span></div>
      <textarea data-kw="${key}">${esc((g.words||[]).join('、'))}</textarea>
    </div>`).join('');
  const bg = openSheet(`
    <h2>雷達關鍵字</h2>
    <p class="hint">用「、」分隔。另有三條固定規則：60 分鐘內新文 +10、內文少於 20 字 −15、同作者 3 篇以上 −25。</p>
    ${groups}
    <div class="sheet-actions">
      <button class="btn" id="kwReset">回復預設</button>
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="kwSave">儲存並重算</button>
    </div>`);
  bg.querySelector('[data-close]').onclick = () => bg.remove();
  bg.querySelector('#kwReset').onclick = () => { store.saveKeywords(null); store.settings.keywords = null; setTimeout(()=>store.pull().then(render),300); bg.remove(); render(); toast('已回復預設'); };
  bg.querySelector('#kwSave').onclick = () => {
    bg.querySelectorAll('[data-kw]').forEach(ta => { kw[ta.dataset.kw].words = ta.value.split(/[、,\n]/).map(s=>s.trim()).filter(Boolean); });
    store.saveKeywords(kw); setTimeout(()=>store.pull().then(render),300); bg.remove(); render(); toast('已更新，分數已重算');
  };
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ const bg = document.querySelector('.sheet-bg'); if (bg) bg.remove(); }
});

/* ============================================================
   每分鐘自動更新
   ============================================================ */
async function tick(){
  if (document.querySelector('.sheet-bg')) { render(); return; }  // 正在填單就不打斷，只更新周邊
  await store.pull();
  render();
  beat();
}
render();
store.init().then(() => { render(); beat(); });
setInterval(tick, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
</script>
