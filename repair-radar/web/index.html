<title>維修需求雷達</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#0e1416;
  --ground:#f2f4f3;
  --surface:#ffffff;
  --surface-2:#e8ecea;
  --line:#cdd6d3;
  --line-soft:#dde4e2;
  --text:#12191b;
  --text-2:#4d5c60;
  --text-3:#77878b;
  --accent:#e2571c;
  --accent-soft:#fbe6da;
  --hot:#e2571c;
  --warm:#c58a12;
  --cool:#4f7f93;
  --good:#2f8f5b;
  --bad:#c8443f;
  --shadow:0 1px 2px rgba(14,20,22,.07),0 8px 24px -16px rgba(14,20,22,.35);
}
:root:not([data-theme="light"]){
  color-scheme:dark light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0b1113;
    --surface:#141c1f;
    --surface-2:#1c2629;
    --line:#2b3639;
    --line-soft:#212b2e;
    --text:#e6ecea;
    --text-2:#9fb0b2;
    --text-3:#6f8083;
    --accent:#ff7a2f;
    --accent-soft:#33200f;
    --hot:#ff7a2f;
    --warm:#e0a94a;
    --cool:#77a9be;
    --good:#4cc188;
    --bad:#e5615c;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 32px -20px #000;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0b1113;
  --surface:#141c1f;
  --surface-2:#1c2629;
  --line:#2b3639;
  --line-soft:#212b2e;
  --text:#e6ecea;
  --text-2:#9fb0b2;
  --text-3:#6f8083;
  --accent:#ff7a2f;
  --accent-soft:#33200f;
  --hot:#ff7a2f;
  --warm:#e0a94a;
  --cool:#77a9be;
  --good:#4cc188;
  --bad:#e5615c;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 32px -20px #000;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 96px}

/* ---------- header ---------- */
header.top{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-soft);
}
.top-inner{max-width:1180px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand h1{
  margin:0;font-family:Archivo,"Noto Sans TC",sans-serif;font-weight:800;
  font-size:19px;letter-spacing:-.015em;white-space:nowrap;
}
.brand .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);white-space:nowrap}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ---------- stat strip ---------- */
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  background:var(--line-soft);border:1px solid var(--line-soft);
  border-radius:10px;overflow:hidden;margin:14px 0 12px;
}
.stat{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:21px;font-weight:600;line-height:1.15}
.stat .n{font-size:11px;color:var(--text-3)}
.stat.alert .v{color:var(--bad)}
.stat.warn .v{color:var(--warm)}

.quota-bar{height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-top:5px}
.quota-bar i{display:block;height:100%;background:var(--good);transition:width .4s ease}
.quota-bar.warn i{background:var(--warm)}
.quota-bar.alert i{background:var(--bad)}

/* ---------- notice ---------- */
.notice{
  display:flex;gap:10px;align-items:flex-start;
  border:1px solid var(--line);border-left:3px solid var(--warm);
  background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--text-2);
}
.notice strong{color:var(--text)}
.notice.hot{border-left-color:var(--bad)}

/* ---------- filters ---------- */
.filters{
  position:sticky;top:52px;z-index:30;
  background:color-mix(in srgb,var(--ground) 92%,transparent);
  backdrop-filter:blur(10px);
  padding:8px 0 10px;margin-bottom:2px;
  border-bottom:1px solid var(--line-soft);
}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--line);background:var(--surface);color:var(--text-2);
  padding:5px 11px;border-radius:999px;font-size:12.5px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;
}
.chip:hover{border-color:var(--text-3)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--ground);border-color:var(--text)}
.chip .cnt{font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.65}
.searchrow{display:flex;gap:6px;margin-top:8px}
.searchrow input[type="search"]{
  flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:7px 11px;font-size:14px;
}
.searchrow select{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;
}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line);background:var(--surface);color:var(--text);
  border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;transition:.15s;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--text-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2);padding:6px 8px}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}

/* ---------- list ---------- */
.section-head{
  display:flex;align-items:baseline;gap:9px;margin:18px 0 8px;
}
.section-head h2{
  margin:0;font-family:Archivo,"Noto Sans TC",sans-serif;font-size:13px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--text-2);
}
.section-head .rule{flex:1;height:1px;background:var(--line-soft)}
.section-head .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--text-3)}

.list{display:flex;flex-direction:column;gap:8px}

.post{
  display:grid;grid-template-columns:44px 1fr;
  background:var(--surface);border:1px solid var(--line-soft);
  border-radius:10px;overflow:hidden;transition:.15s;
}
.post:hover{border-color:var(--line)}
.post.tier-hot{border-color:color-mix(in srgb,var(--hot) 45%,var(--line-soft))}
.post.done{opacity:.62}

.spine{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 0;
  background:var(--surface-2);border-right:1px solid var(--line-soft);
}
.score{
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:17px;font-weight:600;line-height:1;
}
.tier-hot .score{color:var(--hot)}
.tier-warm .score{color:var(--warm)}
.tier-cool .score{color:var(--cool)}
.tier-cold .score{color:var(--text-3)}
.spine .lbl{font-size:9px;letter-spacing:.08em;color:var(--text-3);writing-mode:horizontal-tb}
.spine .dot{width:5px;height:5px;border-radius:50%;background:var(--hot);margin-top:2px}

.body{padding:11px 12px 11px 13px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--text-3);margin-bottom:5px}
.meta .src{font-family:"IBM Plex Mono",monospace;color:var(--text-2);font-weight:500}
.meta .sep{opacity:.4}
.post h3{
  margin:0 0 5px;font-size:15.5px;font-weight:700;line-height:1.4;text-wrap:balance;
}
.post h3 a{color:inherit;text-decoration:none;background-image:linear-gradient(var(--line),var(--line));background-size:100% 1px;background-position:0 100%;background-repeat:no-repeat}
.post h3 a:hover{color:var(--accent)}
.excerpt{font-size:13.5px;color:var(--text-2);margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post.open .excerpt{-webkit-line-clamp:unset;display:block;white-space:pre-wrap}

.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.tag{
  font-size:11px;padding:2px 7px;border-radius:5px;
  background:var(--surface-2);color:var(--text-2);border:1px solid var(--line-soft);
}
.tag.device{color:var(--cool);border-color:color-mix(in srgb,var(--cool) 30%,transparent)}
.tag.issue{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.tag.region{color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent)}

.rowactions{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.statusgroup{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.statusgroup button{
  border:0;background:var(--surface);color:var(--text-3);padding:4px 9px;font-size:11.5px;
  border-right:1px solid var(--line-soft);
}
.statusgroup button:last-child{border-right:0}
.statusgroup button[aria-pressed="true"]{background:var(--text);color:var(--ground);font-weight:500}
.statusgroup button[data-s="deal"][aria-pressed="true"]{background:var(--good);color:#04140b}
.statusgroup button[data-s="skip"][aria-pressed="true"]{background:var(--surface-2);color:var(--text-2)}

.pitch{
  margin-top:9px;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2);
  padding:10px 11px;font-size:13.5px;line-height:1.75;white-space:pre-wrap;
}
.pitch .pitch-actions{display:flex;gap:6px;margin-top:8px;border:0;padding:0}
.breakdown{margin-top:8px;font-size:11.5px;color:var(--text-3);font-family:"IBM Plex Mono",monospace;line-height:1.8}
.breakdown b{color:var(--text-2);font-weight:500}
.breakdown .plus{color:var(--good)}
.breakdown .minus{color:var(--bad)}

.empty{
  border:1px dashed var(--line);border-radius:10px;padding:26px 18px;text-align:center;color:var(--text-3);font-size:13.5px;
}

/* ---------- sheet / modal ---------- */
.sheet-bg{
  position:fixed;inset:0;background:rgba(6,10,11,.55);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;padding:0;
}
.sheet{
  background:var(--surface);border:1px solid var(--line);border-bottom:0;
  border-radius:14px 14px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;
  padding:16px 15px 22px;box-shadow:var(--shadow);
}
.sheet h2{margin:0 0 3px;font-family:Archivo,"Noto Sans TC",sans-serif;font-size:17px;font-weight:700}
.sheet p.hint{margin:0 0 14px;font-size:12.5px;color:var(--text-3)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.field label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.field input,.field textarea,.field select{
  background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;width:100%;
}
.field textarea{min-height:96px;resize:vertical;line-height:1.6}
.field .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;position:sticky;bottom:-22px;background:var(--surface);padding:10px 0 0}
.livescore{
  display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;background:var(--surface-2);margin-bottom:12px;
}
.livescore .big{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;line-height:1}
.livescore .txt{font-size:12.5px;color:var(--text-2);line-height:1.5}

.kw-group{border:1px solid var(--line-soft);border-radius:9px;margin-bottom:8px;overflow:hidden}
.kw-head{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface-2);font-size:12.5px}
.kw-head .w{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12px}
.kw-head .w.plus{color:var(--good)}
.kw-head .w.minus{color:var(--bad)}
.kw-group textarea{border:0;border-top:1px solid var(--line-soft);border-radius:0;background:var(--surface);min-height:52px;font-size:13px;font-family:"IBM Plex Mono",monospace}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:80;
  background:var(--text);color:var(--ground);padding:9px 16px;border-radius:999px;font-size:13px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

.fab{
  position:fixed;right:16px;bottom:18px;z-index:50;
  background:var(--accent);color:#fff;border:0;border-radius:999px;
  padding:13px 19px;font-size:14px;font-weight:700;box-shadow:0 8px 24px -8px rgba(0,0,0,.5);
  display:inline-flex;align-items:center;gap:7px;
}
.footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--text-3);line-height:1.8}
.footer code{font-family:"IBM Plex Mono",monospace;background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:11.5px}

@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .brand .sub{display:none}
  .wrap{padding-bottom:110px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>維修需求雷達</h1>
      <span class="sub">Repair Radar · 中和</span>
    </div>
    <div class="top-actions">
      <button class="btn ghost sm" id="btnKw" title="關鍵字與評分設定">關鍵字</button>
      <button class="btn ghost sm" id="btnImport" title="匯入爬蟲 JSON">匯入</button>
      <button class="btn ghost sm" id="btnTheme" title="切換深淺色">◐</button>

</header>

<main class="wrap">

  <div class="stats" id="stats"></div>

  <div class="filters">

    <div class="searchrow">

  <div id="board"></div>

  </div>
</main>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   維修需求雷達 — 看板 / 評分 / 話術
   ============================================================ */

const STATUS = {
  new:     {label:'未處理', order:0},
  contact: {label:'已聯絡', order:1},
  deal:    {label:'已成交', order:2},
  skip:    {label:'不適合', order:3},
};

const DEFAULT_KEYWORDS = {
  intent: {label:'求助意圖', weight:30, words:['求推薦','有推薦嗎','推薦嗎','求救','求助','哪裡修','哪邊修','該修還是換','有人知道','跪求','請問有','怎麼辦']},
  fault:  {label:'故障描述', weight:25, words:['螢幕破','螢幕裂','螢幕摔','摔到','摔破','進水','泡水','開不了機','無法開機','充不了電','不能充電','電池膨脹','耗電快','鏡頭裂','面板','觸控失靈','失靈','主機板','黑屏','沒畫面','尾插','充電孔']},
  device: {label:'裝置型號', weight:15, words:['iPhone','iPad','Android','Samsung','三星','Pixel','Switch','MacBook','筆電','平板','華碩','ASUS','小米','OPPO','Sony','ROG','紅米','vivo','realme']},
  repair: {label:'維修字眼', weight:15, words:['維修','修理','送修','報價','價格','多少錢','估價','換螢幕','換電池']},
  region: {label:'雙北地區', weight:10, words:['台北','臺北','新北','中和','永和','板橋','南勢角','景安','雙北','新店','土城']},
  mail:   {label:'可寄修',   weight:5,  words:['寄修','可寄','宅配']},
  done:   {label:'已解決',   weight:-40, words:['已修好','修好了','修完','感謝大家','已解決','結案','已處理完']},
  trade:  {label:'買賣文',   weight:-30, words:['二手','出售','徵求購買','收購','換現金','讓售','便宜賣']},
  ad:     {label:'業配廣告', weight:-25, words:['業配','廣告','開箱','評測','實測心得','合作文']},
};

const RULE_FRESH = {label:'60 分鐘內新文', weight:10};
const RULE_SHOP  = {label:'疑似店家推廣（同作者多篇）', weight:-25};
const RULE_SHORT = {label:'內文少於 20 字', weight:-15};

const ISSUE_MAP = [
  {key:'screen',  label:'螢幕',   words:['螢幕破','螢幕裂','螢幕摔','面板','破圖','沒畫面','黑屏','觸控失靈','裂開']},
  {key:'water',   label:'進水',   words:['進水','泡水','浸水','掉水']},
  {key:'battery', label:'電池',   words:['電池膨脹','耗電快','電池','續航','膨脹','很快沒電']},
  {key:'power',   label:'開不了機',words:['開不了機','無法開機','沒反應','不能開機','自動關機']},
  {key:'charge',  label:'充電',   words:['充不了電','不能充電','充電孔','尾插','接觸不良']},
  {key:'board',   label:'主機板', words:['主機板','板子','短路','燒板']},
  {key:'camera',  label:'鏡頭',   words:['鏡頭裂','鏡頭','相機模糊','後鏡頭']},
];

const DEVICE_MAP = [
  {key:'iphone', label:'iPhone',  words:['iphone','ip13','ip14','ip15','蘋果手機']},
  {key:'ipad',   label:'iPad',    words:['ipad','平板']},
  {key:'mac',    label:'Mac',     words:['macbook','imac','mac mini']},
  {key:'android',label:'Android', words:['android','安卓','三星','samsung','pixel','小米','紅米','oppo','vivo','realme','sony','華碩','asus','rog','htc']},
  {key:'switch', label:'Switch',  words:['switch','ns主機']},
  {key:'laptop', label:'筆電',    words:['筆電','notebook','laptop']},
];

const REGION_WORDS = ['中和','永和','板橋','南勢角','景安','新北','台北','臺北','新店','土城','雙北'];

/* ---------- 示範資料（頁面內建，僅在看板還沒有資料時顯示） ---------- */

function mins(m){ return new Date(Date.now() - m*60000).toISOString(); }

/* ============================================================
   儲存層：優先 db capability（跨裝置），退回 localStorage
   ============================================================ */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};

const store = {
  db:null,
  posts:new Map(),
  settings:{ line_quota_used:0, quota_month:monthKey(), keywords:null },

  async init(){
    try{
      if (window.claude && typeof window.claude.use === 'function'){
        this.db = await window.claude.use('db');
      }
    }catch(e){ this.db = null; }

    if (this.db){
      try{
        const snap = await this.db.collection('posts').limit(500).get();
        (snap || []).forEach(d => { const v = d.data ? d.data() : d; if (v && v.id) this.posts.set(v.id, v); });
        const cfg = await this.db.doc('config/settings').get();
        const cv = cfg && (cfg.data ? cfg.data() : cfg);
        if (cv) this.settings = Object.assign(this.settings, cv);
        this.db.collection('posts').onSnapshot(list => {
          (list || []).forEach(d => { const v = d.data ? d.data() : d; if (v && v.id) this.posts.set(v.id, v); });
          render();
        });
      }catch(e){ this.db = null; }
    }
    if (!this.db){
      LS.get('rr_posts', []).forEach(p => this.posts.set(p.id, p));
      this.settings = Object.assign(this.settings, LS.get('rr_settings', {}));
    }
    if (this.settings.quota_month !== monthKey()){
      this.settings.quota_month = monthKey();
      this.settings.line_quota_used = 0;
      this.saveSettings();
    }
  },

  savePost(p){
    this.posts.set(p.id, p);
    if (this.db){ this.db.doc('posts/' + p.id).set(p).catch(()=>{}); }
    else { LS.set('rr_posts', [...this.posts.values()]); }
  },
  removePost(id){
    this.posts.delete(id);
    if (this.db){ this.db.doc('posts/' + id).delete().catch(()=>{}); }
    else { LS.set('rr_posts', [...this.posts.values()]); }
  },
  saveSettings(){
    if (this.db){ this.db.doc('config/settings').set(this.settings).catch(()=>{}); }
    else { LS.set('rr_settings', this.settings); }
  },
  keywords(){ return this.settings.keywords || DEFAULT_KEYWORDS; },
};

function monthKey(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }

/* ============================================================
   評分引擎
   ============================================================ */
function normalize(s){ return (s || '').toLowerCase(); }

function scorePost(post, allPosts){
  const kw = store.keywords();
  const text = normalize(post.title + '\n' + post.body);
  const hits = [];
  let total = 0;

  for (const [key, g] of Object.entries(kw)){
    const found = (g.words || []).filter(w => w && text.includes(normalize(w)));
    if (found.length){
      total += g.weight;
      hits.push({label:g.label, weight:g.weight, detail:found.slice(0,3).join('、')});
    }
  }

  const ageMin = (Date.now() - new Date(post.posted_at).getTime()) / 60000;
  if (ageMin <= 60){ total += RULE_FRESH.weight; hits.push({label:RULE_FRESH.label, weight:RULE_FRESH.weight, detail:Math.max(0,Math.round(ageMin)) + ' 分鐘前'}); }

  const bodyLen = (post.body || '').replace(/\s/g,'').length;
  if (bodyLen < 20){ total += RULE_SHORT.weight; hits.push({label:RULE_SHORT.label, weight:RULE_SHORT.weight, detail:bodyLen + ' 字'}); }

  if (post.author && post.author !== '匿名'){
    const same = (allPosts || []).filter(p => p.author === post.author).length;
    if (same >= 3){ total += RULE_SHOP.weight; hits.push({label:RULE_SHOP.label, weight:RULE_SHOP.weight, detail:same + ' 篇'}); }
  }

  return { score: Math.max(0, Math.min(100, total)), hits };
}

function detect(map, text){
  const t = normalize(text);
  return map.filter(m => m.words.some(w => t.includes(normalize(w)))).map(m => m.label);
}
function detectRegion(text){
  return REGION_WORDS.filter(w => text.includes(w));
}

function enrich(post, all){
  const {score, hits} = scorePost(post, all);
  const text = post.title + '\n' + post.body;
  return Object.assign({}, post, {
    score,
    hits,
    devices: detect(DEVICE_MAP, text),
    issues: detect(ISSUE_MAP, text),
    regions: [...new Set(detectRegion(text))],
    status: post.status || 'new',
  });
}

/* ---------- LINE 額度與門檻 ---------- */
function threshold(){
  const used = store.settings.line_quota_used || 0;
  if (used >= 195) return {value:Infinity, mode:'off'};
  if (used >= 180) return {value:85, mode:'tight'};
  return {value:70, mode:'normal'};
}

/* ============================================================
   話術生成
   ============================================================ */
const PITCH_OPENERS = {
  '螢幕': d => `${d} 螢幕摔破如果觸控還正常、顯示也沒有線條，通常換總成就好，內部零件多半沒事。原廠料跟副廠價差不少，看你打算再用多久決定就行。`,
  '進水': d => `${d} 進水最怕的是通電，先別急著開機或充電，也不要用吹風機熱風吹。越早拆開做超音波清洗、把腐蝕擋下來，救回來的機會越高，資料通常也還在。`,
  '電池': d => `${d} 這種膨脹或掉電特別快，八成是電池循環數到了，換電池就好，不用整台換。膨脹會頂到螢幕，建議別再拖，越頂越貴。`,
  '開不了機': d => `${d} 完全沒反應的話，先排除電池跟尾插這兩個，是最常見也最便宜的原因。真的都不是才會往主機板方向查，那個才是大工程。`,
  '充電': d => `${d} 充電要喬角度通常是尾插排線鬆或積灰，單換尾插就能解決，不用動到主機板。原廠線都試過還這樣，基本上可以確定是接口了。`,
  '主機板': d => `${d} 主機板的問題要看是哪一組電路，通常要上機測才知道。這種修之前一定要先確認資料還救不救得回來，順序不能反。`,
  '鏡頭': d => `${d} 鏡頭玻璃裂通常只要換外層玻璃，模組本身沒事的話成本差很多，不用直接換整組。`,
};

function makePitch(p){
  const device = p.devices[0] || '你的機器';
  const issue = p.issues[0];
  const opener = (PITCH_OPENERS[issue] || (d => `${d} 這個狀況要先做檢測才能確定是哪個零件出問題，這種通常不會只有一個可能。`))(device);
  const local = p.regions.length
    ? `你在${p.regions[0]}的話離我很近，`
    : `不方便跑一趟的話也可以寄修，`;
  const close = `我在中和有在做這塊，${local}需要的話可以先幫你估個價，檢測不收費也不用先付錢。`;
  return opener + '\n\n' + close;
}

/* ============================================================
   Render
   ============================================================ */
const state = { status:'all', device:'', source:'', minScore:0, hours:0, q:'' };
let usingExamples = false;

function allPosts(){
  const real = [...store.posts.values()];
  usingExamples = real.length === 0;
  const base = usingExamples ? EXAMPLES : real;
  return base.map(p => enrich(p, base)).sort((a,b) => new Date(b.posted_at) - new Date(a.posted_at));
}

function relTime(iso){
  const m = Math.round((Date.now() - new Date(iso).getTime())/60000);
  if (m < 1) return '剛剛';
  if (m < 60) return m + ' 分鐘前';
  if (m < 1440) return Math.floor(m/60) + ' 小時前';
  return Math.floor(m/1440) + ' 天前';
}
function tierOf(s){ const t = threshold().value === Infinity ? 70 : threshold().value;
  if (s >= t) return 'hot'; if (s >= 50) return 'warm'; if (s >= 30) return 'cool'; return 'cold'; }

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const posts = allPosts();
  renderQuota(posts);
  renderStats(posts);
  renderChips(posts);
  renderBoard(posts);
}

function renderQuota(posts){
  const t = threshold();
  const used = store.settings.line_quota_used || 0;
  const el = document.getElementById('quotaNotice');
  if (t.mode === 'normal'){ el.innerHTML = usingExamples
    ? `<div class="notice"><span>◆</span><div><strong>目前顯示示範資料。</strong>按右下「貼上需求」加入第一則真實貼文，或用右上「匯入」貼上爬蟲產出的 JSON，示範資料就會自動消失。</div></div>`
    : ''; return; }
  const msg = t.mode === 'off'
    ? `<strong>本月 LINE 額度已滿（${used}/200）。</strong>推播全部改走 Telegram，看板照常更新。額度每月 1 日歸零。`
    : `<strong>LINE 額度剩 ${200-used} 則。</strong>推播門檻已自動從 70 分提高到 85 分，只有最有把握的才會通知。`;
  el.innerHTML = `<div class="notice ${t.mode==='off'?'hot':''}"><span>◆</span><div>${msg}</div></div>`;
}

function renderStats(posts){
  const today = posts.filter(p => new Date(p.posted_at).toDateString() === new Date().toDateString()).length;
  const used = store.settings.line_quota_used || 0;
  const left = Math.max(0, 200 - used);
  const contacted = posts.filter(p => p.status !== 'new').length;
  const deals = posts.filter(p => p.status === 'deal').length;
  const rate = contacted ? Math.round(deals/contacted*100) : 0;
  const t = threshold();
  const hot = posts.filter(p => p.status === 'new' && p.score >= (t.value === Infinity ? 70 : t.value)).length;
  const pct = Math.round(left/200*100);
  const cls = left <= 5 ? 'alert' : left <= 20 ? 'warn' : '';

  document.getElementById('stats').innerHTML = `
    <div class="stat ${hot?'warn':''}">
      <span class="k">現在該回</span>
      <span class="v">${hot}</span>
      <span class="n">未處理且 ≥ ${t.value===Infinity?70:t.value} 分</span>
    </div>
    <div class="stat">
      <span class="k">今日新增</span>
      <span class="v">${today}</span>
      <span class="n">共 ${posts.length} 則在看板</span>
    </div>
    <div class="stat ${cls}">
      <span class="k">LINE 額度</span>
      <span class="v">${left}</span>
      <span class="n">已用 ${used}／200</span>
      <span class="quota-bar ${cls}"><i style="width:${pct}%"></i></span>
    </div>
    <div class="stat">
      <span class="k">成交轉換</span>
      <span class="v">${rate}%</span>
      <span class="n">${deals} 成交 / ${contacted} 已處理</span>
    </div>`;
}

function renderChips(posts){
  const counts = {all:posts.length};
  Object.keys(STATUS).forEach(k => counts[k] = posts.filter(p => p.status === k).length);
  const items = [['all','全部'], ...Object.entries(STATUS).map(([k,v]) => [k, v.label])];
  document.getElementById('chipsStatus').innerHTML = items.map(([k,label]) =>
    `<button class="chip" data-status="${k}" aria-pressed="${state.status===k}">${label}<span class="cnt">${counts[k]||0}</span></button>`
  ).join('');

  const devs = [...new Set(posts.flatMap(p => p.devices))];
  const issues = [...new Set(posts.flatMap(p => p.issues))];
  const tags = [...devs.map(d=>['device',d]), ...issues.map(i=>['issue',i])];
  document.getElementById('chipsDevice').innerHTML = tags.length
    ? `<button class="chip" data-device="" aria-pressed="${state.device===''}">不分類型</button>` +
      tags.map(([kind,v]) => `<button class="chip" data-device="${esc(v)}" aria-pressed="${state.device===v}">${esc(v)}</button>`).join('')
    : '';

  const srcSel = document.getElementById('fSource');
  const sources = [...new Set(posts.map(p => p.source))].sort();
  const cur = srcSel.value;
  srcSel.innerHTML = '<option value="">全部來源</option>' + sources.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
  srcSel.value = cur;
}

function match(p){
  if (state.status !== 'all' && p.status !== state.status) return false;
  if (state.device && !p.devices.includes(state.device) && !p.issues.includes(state.device)) return false;
  if (state.source && p.source !== state.source) return false;
  if (p.score < state.minScore) return false;
  if (state.hours){
    const h = (Date.now() - new Date(p.posted_at).getTime())/3600000;
    if (h > state.hours) return false;
  }
  if (state.q){
    const t = normalize(p.title + p.body + p.author + p.source);
    if (!t.includes(normalize(state.q))) return false;
  }
  return true;
}

function renderBoard(posts){
  const shown = posts.filter(match);
  const t = threshold().value === Infinity ? 70 : threshold().value;
  const act = shown.filter(p => p.status === 'new' && p.score >= t);
  const other = shown.filter(p => p.status === 'new' && p.score < t);
  const handled = shown.filter(p => p.status !== 'new');

  const board = document.getElementById('board');
  if (!shown.length){
    board.innerHTML = `<div class="empty" style="margin-top:20px">這個篩選條件下沒有貼文。放寬條件，或按右下角「貼上需求」新增一則。</div>`;
    return;
  }
  let html = '';
  if (act.length) html += section('現在該回', act.length, act.map(card).join(''));
  if (other.length) html += section('其餘需求', other.length, other.map(card).join(''));
  if (handled.length) html += section('已處理', handled.length, handled.map(card).join(''));
  board.innerHTML = html;
}

function section(title, n, inner){
  return `<div class="section-head"><h2>${title}</h2><span class="n">${n}</span><span class="rule"></span></div><div class="list">${inner}</div>`;
}

function card(p){
  const tier = tierOf(p.score);
  const tags = [
    ...p.devices.map(d => `<span class="tag device">${esc(d)}</span>`),
    ...p.issues.map(i => `<span class="tag issue">${esc(i)}</span>`),
    ...p.regions.slice(0,2).map(r => `<span class="tag region">${esc(r)}</span>`),
    p.demo ? '<span class="tag">示範</span>' : '',
  ].join('');
  const statusBtns = Object.entries(STATUS).map(([k,v]) =>
    `<button data-s="${k}" data-id="${p.id}" aria-pressed="${p.status===k}">${v.label}</button>`).join('');

  const bd = p.hits.map(h =>
    `<div><b>${esc(h.label)}</b> <span class="${h.weight>0?'plus':'minus'}">${h.weight>0?'+':''}${h.weight}</span>${h.detail?` <span style="opacity:.7">${esc(h.detail)}</span>`:''}</div>`
  ).join('') || '<div>沒有命中任何關鍵字</div>';

  return `
  <article class="post tier-${tier} ${p.status!=='new'?'done':''}" data-id="${p.id}">
    <div class="spine">
      <span class="score mono">${p.score}</span>
      <span class="lbl">分</span>
      ${tier==='hot' && p.status==='new' ? '<span class="dot"></span>' : ''}
    </div>
    <div class="body">
      <div class="meta">
        <span class="src">${esc(p.source)}</span><span class="sep">·</span>
        <span>${esc(p.author||'—')}</span><span class="sep">·</span>
        <span>${relTime(p.posted_at)}</span>
      </div>
      <h3>${p.url && p.url !== '#' ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title)}</h3>
      <p class="excerpt">${esc(p.body)}</p>
      ${tags ? `<div class="tags">${tags}</div>` : ''}
      <div class="rowactions">
        <div class="statusgroup">${statusBtns}</div>
        <button class="btn sm" data-act="pitch" data-id="${p.id}">產生話術</button>
        <button class="btn ghost sm" data-act="expand" data-id="${p.id}">全文</button>
        <button class="btn ghost sm" data-act="why" data-id="${p.id}">分數怎麼算</button>
        ${p.demo ? '' : `<button class="btn ghost sm" data-act="del" data-id="${p.id}" title="從看板移除">刪除</button>`}
      </div>
      <div class="slot-pitch"></div>
      <div class="slot-why" hidden><div class="breakdown">${bd}</div></div>
    </div>
  </article>`;
}

/* ============================================================
   互動
   ============================================================ */
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1900);
}

function findPost(id){ return allPosts().find(p => p.id === id); }

document.addEventListener('click', e => {
  const chip = e.target.closest('[data-status]');
  if (chip){ state.status = chip.dataset.status; render(); return; }

  const dchip = e.target.closest('[data-device]');
  if (dchip){ state.device = dchip.dataset.device; render(); return; }

  const sBtn = e.target.closest('.statusgroup button');
  if (sBtn){
    const p = findPost(sBtn.dataset.id);
    if (!p) return;
    if (p.demo){ toast('示範資料不會被儲存，先加入你自己的貼文'); return; }
    const raw = store.posts.get(p.id);
    raw.status = raw.status === sBtn.dataset.s ? 'new' : sBtn.dataset.s;
    store.savePost(raw);
    render();
    return;
  }

  const act = e.target.closest('[data-act]');
  if (!act) return;
  const p = findPost(act.dataset.id);
  const artEl = act.closest('.post');
  if (!p || !artEl) return;

  if (act.dataset.act === 'expand'){ artEl.classList.toggle('open'); return; }

  if (act.dataset.act === 'why'){
    const slot = artEl.querySelector('.slot-why');
    slot.hidden = !slot.hidden;
    return;
  }

  if (act.dataset.act === 'del'){
    store.removePost(p.id); render(); toast('已從看板移除'); return;
  }

  if (act.dataset.act === 'pitch'){
    const slot = artEl.querySelector('.slot-pitch');
    if (slot.innerHTML){ slot.innerHTML = ''; return; }
    const text = makePitch(p);
    slot.innerHTML = `<div class="pitch">${esc(text)}<div class="pitch-actions">
        <button class="btn sm primary" data-act="copy" data-id="${p.id}">複製</button>
        <button class="btn sm" data-act="pitch2" data-id="${p.id}">換一種說法</button>
      </div></div>`;
    slot.dataset.text = text;
    return;
  }

  if (act.dataset.act === 'copy'){
    const slot = artEl.querySelector('.slot-pitch');
    navigator.clipboard.writeText(slot.dataset.text || '').then(
      () => toast('話術已複製'),
      () => toast('複製失敗，請長按選取文字')
    );
    return;
  }

  if (act.dataset.act === 'pitch2'){
    const slot = artEl.querySelector('.slot-pitch');
    const device = p.devices[0] || '你的機器';
    const alt = `看你的描述，${device} 這狀況我遇過不少次。重點是先確認是單一零件還是連帶影響，這會直接決定價差。你可以先拍一張開機畫面跟外觀給我看，我大概就能判斷八成。\n\n我人在中和，${p.regions.length?`${p.regions[0]}過來很方便，`:'外縣市也可以寄修，'}要的話先幫你估，不合再說。`;
    slot.querySelector('.pitch').firstChild.textContent = alt;
    slot.dataset.text = alt;
    return;
  }
});

document.getElementById('btnTheme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
  if (next) document.documentElement.setAttribute('data-theme', next);
  else document.documentElement.removeAttribute('data-theme');
  LS.set('rr_theme', next);
});
(function(){ const t = LS.get('rr_theme',''); if (t) document.documentElement.setAttribute('data-theme', t); })();

/* ============================================================
   Sheet：新增貼文 / 匯入 / 關鍵字
   ============================================================ */
function openSheet(html){
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
  document.body.appendChild(bg);
  const first = bg.querySelector('input,textarea');
  if (first) first.focus();
  return bg;
}

document.getElementById('fabAdd').addEventListener('click', () => {
  const bg = openSheet(`
    <h2>貼上一則需求</h2>
    <p class="hint">從 PTT／Dcard／Threads 複製標題與內文貼進來，分數即時算給你看。</p>
    <div class="livescore"><span class="big mono" id="lsNum">0</span><span class="txt" id="lsTxt">還沒有內容</span></div>
    <div class="field"><label>標題</label><input id="nTitle" placeholder="iPhone 14 螢幕摔破，台北求推薦"></div>
    <div class="field"><label>內文</label><textarea id="nBody" placeholder="貼上貼文內容…"></textarea></div>
    <div class="field"><label>來源與作者</label><div class="row2">
      <input id="nSource" placeholder="PTT MobileComm" value="PTT MobileComm">
      <input id="nAuthor" placeholder="作者 ID">
    </div></div>
    <div class="field"><label>原文連結（選填）</label><input id="nUrl" placeholder="https://www.ptt.cc/bbs/..."></div>
    <div class="sheet-actions">
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="nSave">加入看板</button>
    </div>`);

  const recalc = () => {
    const draft = {title:v('nTitle'), body:v('nBody'), author:v('nAuthor'), posted_at:new Date().toISOString()};
    const {score, hits} = scorePost(draft, [...store.posts.values()]);
    bg.querySelector('#lsNum').textContent = score;
    bg.querySelector('#lsNum').style.color = score >= 70 ? 'var(--hot)' : score >= 50 ? 'var(--warm)' : 'var(--text-3)';
    const t = threshold();
    bg.querySelector('#lsTxt').innerHTML = hits.length
      ? `${hits.map(h => esc(h.label)).join('、')}<br>${score >= (t.value===Infinity?101:t.value) ? '<strong>達到 LINE 推播門檻</strong>' : `門檻 ${t.value===Infinity?'—（額度已滿）':t.value} 分`}`
      : '還沒命中任何關鍵字';
  };
  const v = id => (bg.querySelector('#'+id).value || '').trim();
  ['nTitle','nBody','nAuthor'].forEach(id => bg.querySelector('#'+id).addEventListener('input', recalc));

  bg.querySelector('[data-close]').addEventListener('click', () => bg.remove());
  bg.querySelector('#nSave').addEventListener('click', () => {
    if (!v('nTitle') && !v('nBody')){ toast('至少要有標題或內文'); return; }
    store.savePost({
      id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      title: v('nTitle') || '(無標題)',
      body: v('nBody'),
      source: v('nSource') || '手動新增',
      author: v('nAuthor') || '—',
      url: v('nUrl') || '#',
      posted_at: new Date().toISOString(),
      status: 'new',
      created_at: new Date().toISOString(),
    });
    bg.remove(); render(); toast('已加入看板');
  });
});

document.getElementById('btnImport').addEventListener('click', () => {
  const bg = openSheet(`
    <h2>匯入爬蟲結果</h2>
    <p class="hint">貼上 JSON 陣列，欄位：title、body、source、url、author、posted_at（ISO 時間）。重複的原文連結會自動略過。</p>
    <div class="field"><label>JSON</label><textarea id="imp" style="min-height:200px;font-family:'IBM Plex Mono',monospace;font-size:12.5px" placeholder='[{"title":"…","body":"…","source":"PTT MobileComm","url":"https://…","author":"abc","posted_at":"2026-09-04T10:00:00Z"}]'></textarea></div>
    <div class="field"><label>本月已用 LINE 額度</label><input id="quotaIn" type="number" min="0" max="200" value="${store.settings.line_quota_used||0}"></div>
    <div class="sheet-actions">
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="impGo">匯入</button>
    </div>`);
  bg.querySelector('[data-close]').addEventListener('click', () => bg.remove());
  bg.querySelector('#impGo').addEventListener('click', () => {
    const q = parseInt(bg.querySelector('#quotaIn').value, 10);
    if (!isNaN(q)){ store.settings.line_quota_used = Math.max(0, Math.min(200, q)); store.saveSettings(); }
    const raw = bg.querySelector('#imp').value.trim();
    if (!raw){ bg.remove(); render(); toast('已更新額度'); return; }
    let arr;
    try { arr = JSON.parse(raw); } catch(e){ toast('JSON 格式有誤，請檢查括號與引號'); return; }
    if (!Array.isArray(arr)){ toast('最外層必須是陣列 [ ]'); return; }
    const seen = new Set([...store.posts.values()].map(p => p.url).filter(u => u && u !== '#'));
    let n = 0;
    arr.forEach(item => {
      if (!item || (!item.title && !item.body)) return;
      if (item.url && seen.has(item.url)) return;
      store.savePost({
        id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,7),
        title: String(item.title || '(無標題)'),
        body: String(item.body || ''),
        source: String(item.source || '未知來源'),
        author: String(item.author || '—'),
        url: String(item.url || '#'),
        posted_at: item.posted_at || new Date().toISOString(),
        status: 'new',
        created_at: new Date().toISOString(),
      });
      if (item.url) seen.add(item.url);
      n++;
    });
    bg.remove(); render(); toast(`匯入 ${n} 則，略過 ${arr.length-n} 則重複`);
  });
});

document.getElementById('btnKw').addEventListener('click', () => {
  const kw = JSON.parse(JSON.stringify(store.keywords()));
  const groups = Object.entries(kw).map(([key, g]) => `
    <div class="kw-group">
      <div class="kw-head"><span>${esc(g.label)}</span>
        <span class="w ${g.weight>0?'plus':'minus'}">${g.weight>0?'+':''}${g.weight} 分</span></div>
      <textarea data-kw="${key}">${esc((g.words||[]).join('、'))}</textarea>
    </div>`).join('');
  const bg = openSheet(`
    <h2>關鍵字與評分</h2>
    <p class="hint">用「、」分隔。分數規則沿用原設定：命中該組任一關鍵字即計一次分。另有三條固定規則：60 分鐘內新文 +10、內文少於 20 字 −15、同作者 3 篇以上 −25。</p>
    ${groups}
    <div class="sheet-actions">
      <button class="btn" id="kwReset">回復預設</button>
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="kwSave">儲存並重算</button>
    </div>`);
  bg.querySelector('[data-close]').addEventListener('click', () => bg.remove());
  bg.querySelector('#kwReset').addEventListener('click', () => {
    store.settings.keywords = null; store.saveSettings(); bg.remove(); render(); toast('已回復預設關鍵字');
  });
  bg.querySelector('#kwSave').addEventListener('click', () => {
    bg.querySelectorAll('[data-kw]').forEach(ta => {
      const key = ta.dataset.kw;
      kw[key].words = ta.value.split(/[、,\n]/).map(s => s.trim()).filter(Boolean);
    });
    store.settings.keywords = kw; store.saveSettings(); bg.remove(); render(); toast('已更新，分數已重算');
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ const bg = document.querySelector('.sheet-bg'); if (bg) bg.remove(); }
});

render();
